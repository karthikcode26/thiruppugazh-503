<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c0392b" />
  <title>பாடல் | Thiruppugazh Song</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>திருப்புகழ்</h1>
      <p class="sub">Thiruppugazh</p>
    </header>

    <main class="detail" id="detail">
      <div class="loading">ஏற்றுகிறது… Loading…</div>
    </main>

    <footer class="footer">
      அருணகிரிநாதர் திருப்புகழ்
    </footer>
  </div>

  <script>
    (function () {
      const rawNumber = new URLSearchParams(location.search).get("n") || "";
      const n = /^\d+$/.test(rawNumber) ? Number(rawNumber) : NaN;
      const detail = document.getElementById("detail");
      const videoIdPattern = /^[A-Za-z0-9_-]{11}$/;

      function esc(value) {
        return String(value).replace(/[&<>"']/g, character => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[character]);
      }

      fetch("songs.json")
        .then(response => {
          if (!response.ok) throw new Error("Could not load songs");
          return response.json();
        })
        .then(songs => {
          const song = songs.find(item => item.num === n);
          if (!song) {
            detail.innerHTML = '<a class="back" href="index.html">‹ திரும்பு · Back</a><p class="empty">பாடல் கிடைக்கவில்லை · Song not found.</p>';
            document.title = "Not found";
            return;
          }

          document.title = `${song.num}. ${song.t} | திருப்புகழ்`;
          const videoId = typeof song.youtubeId === "string" && videoIdPattern.test(song.youtubeId)
            ? song.youtubeId
            : "";
          const searchQuery = encodeURIComponent(`Thiruppugazh ${song.t} திருப்புகழ்`);
          const searchUrl = `https://www.youtube.com/results?search_query=${searchQuery}`;
          const watchUrl = videoId ? `https://www.youtube.com/watch?v=${videoId}` : searchUrl;
          const videoContent = videoId
            ? `<div class="videowrap">
                <iframe
                  src="https://www.youtube-nocookie.com/embed/${videoId}?rel=0"
                  title="${esc(song.t)} YouTube video"
                  loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen></iframe>
              </div>`
            : `<p class="video-pending">இந்த பாடலுக்கு உறுதிசெய்யப்பட்ட காணொளி இன்னும் சேர்க்கப்படவில்லை.<br>No video has been confirmed for this song yet.</p>`;
          const buttonLabel = videoId ? "YouTube இல் திற" : "YouTube இல் தேடு";
          const buttonHint = videoId
            ? "காணொளியை YouTube இல் திறக்கும்"
            : "இந்த பாடலுக்கான காணொளிகளைத் தேடும்";
          const alternateSearchButton = videoId
            ? `<a class="btn btn-search" href="${searchUrl}" target="_blank" rel="noopener">
                <span class="ico">⌕</span>
                <span class="label">வேறு காணொளியைத் தேடு
                  <span class="hint">இந்த பாடலுக்கான மற்ற YouTube காணொளிகளைத் தேடும்</span>
                </span>
              </a>`
            : "";

          detail.innerHTML = `
            <a class="back" href="index.html">‹ பட்டியல் · Back to list</a>

            <section class="songcard">
              <div class="bignum">${song.num}</div>
              <div class="bigtitle">${esc(song.t)}</div>
              <div class="oldno">பாடல் எண் ${song.num}</div>
            </section>

            ${videoContent}

            <div class="actions">
              <a class="btn btn-youtube" href="${watchUrl}" target="_blank" rel="noopener">
                <span class="ico">▶</span>
                <span class="label">${buttonLabel}
                  <span class="hint">${buttonHint}</span>
                </span>
              </a>
              ${alternateSearchButton}
            </div>
          `;
        })
        .catch(() => {
          detail.innerHTML = '<a class="back" href="index.html">‹ Back</a><p class="empty">Could not load songs.json.</p>';
        });
    })();
  </script>
</body>
</html>
