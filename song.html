<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c0392b" />
  <title>பாடல் | Thiruppugazh Song</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>திருப்புகழ்</h1>
      <p class="sub">Thiruppugazh</p>
    </header>

    <main class="detail" id="detail">
      <div class="loading">ஏற்றுகிறது… Loading…</div>
    </main>

    <footer class="footer">
      Lyrics &amp; audio courtesy of
      <a href="https://kaumaram.com" target="_blank" rel="noopener">kaumaram.com</a>.
    </footer>
  </div>

  <script src="app.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const n = parseInt(params.get("n"), 10);
      const detail = document.getElementById("detail");

      function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

      fetch("songs.json")
        .then(r => r.json())
        .then(songs => {
          const song = songs.find(s => s.num === n);
          if (!song) {
            detail.innerHTML = '<a class="back" href="index.html">‹ திரும்பு · Back</a><p class="empty">பாடல் கிடைக்கவில்லை · Song not found.</p>';
            document.title = "Not found";
            return;
          }
          document.title = `${song.num}. ${song.t} | திருப்புகழ்`;

          const lyricsUrl = window.kaumaramUrl(song.k);

          // Video: if this song has a Google Drive file id (song.v), use it.
          // Drive "/preview" plays inline; "/view" opens Drive in a new tab.
          // Songs without a video fall back to a YouTube search.
          const hasVideo = !!song.v;
          const drivePreview = hasVideo ? `https://drive.google.com/file/d/${song.v}/preview` : "";
          const driveOpen = hasVideo ? `https://drive.google.com/file/d/${song.v}/view` : "";
          const ytQuery = encodeURIComponent(`Thiruppugazh ${song.t} திருப்புகழ்`);
          const youtubeUrl = `https://www.youtube.com/results?search_query=${ytQuery}`;

          const videoButton = hasVideo
            ? `<a class="btn btn-youtube" href="${driveOpen}" target="_blank" rel="noopener">
                 <span class="ico">▶</span>
                 <span class="label">காணொளி (Watch Video)
                   <span class="hint">Google Drive இல் திறக்கும்</span>
                 </span>
               </a>`
            : `<a class="btn btn-youtube" href="${youtubeUrl}" target="_blank" rel="noopener">
                 <span class="ico">▶</span>
                 <span class="label">YouTube இல் தேடு (Search)
                   <span class="hint">இந்த பாடலுக்கு காணொளி இன்னும் சேர்க்கப்படவில்லை</span>
                 </span>
               </a>`;

          detail.innerHTML = `
            <a class="back" href="index.html">‹ பட்டியல் · Back to list</a>

            <section class="songcard">
              <div class="bignum">${song.num}</div>
              <div class="bigtitle">${esc(song.t)}</div>
              <div class="oldno">பாடல் எண் ${song.num} · kaumaram #${song.k}</div>
            </section>

            ${hasVideo ? `<div class="videowrap"><iframe
                src="${drivePreview}"
                allow="autoplay"
                allowfullscreen
                loading="lazy"
                title="Video for song ${song.num}"></iframe></div>` : ""}

            <div class="actions">
              <a class="btn btn-lyrics" href="${lyricsUrl}" target="_blank" rel="noopener">
                <span class="ico">📖</span>
                <span class="label">பாடல் வரிகள் (Lyrics)
                  <span class="hint">kaumaram.com இல் திறக்கும்</span>
                </span>
              </a>

              ${videoButton}
            </div>
          `;
        })
        .catch(() => {
          detail.innerHTML = '<a class="back" href="index.html">‹ Back</a><p class="empty">Could not load songs.json.</p>';
        });
    })();
  </script>
</body>
</html>
