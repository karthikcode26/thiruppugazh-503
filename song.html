<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c0392b" />
  <title>பாடல் | Thiruppugazh Song</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=23" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>திருப்புகழ்</h1>
      <p class="sub">Thiruppugazh</p>
    </header>

    <main class="detail" id="detail">
      <div class="loading">ஏற்றுகிறது… Loading…</div>
    </main>

    <footer class="footer">
      அருணகிரிநாதர் திருப்புகழ்
    </footer>
  </div>

  <script src="store.js?v=23"></script>
  <script src="audio.js?v=23"></script>
  <script>
    (function () {
      const rawNumber = new URLSearchParams(location.search).get("n") || "";
      const n = /^\d+$/.test(rawNumber) ? Number(rawNumber) : NaN;
      const store = window.TPStore || null;
      const detail = document.getElementById("detail");
      const videoIdPattern = /^[A-Za-z0-9_-]{11}$/;

      function esc(value) {
        return String(value).replace(/[&<>"']/g, character => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[character]);
      }

      fetch("songs.json?v=23")
        .then(response => {
          if (!response.ok) throw new Error("Could not load songs");
          return response.json();
        })
        .then(songs => {
          const song = songs.find(item => item.num === n);
          if (!song) {
            detail.innerHTML = '<a class="back" href="index.html">‹ திரும்பு · Back</a><p class="empty">பாடல் கிடைக்கவில்லை · Song not found.</p>';
            document.title = "Not found";
            return;
          }

          document.title = `${song.num}. ${song.t} | திருப்புகழ்`;
          const playlistId = "PLFwcC0dtfDTiQSDIfbF9EJYEqTaA4iZ_6";
          const videoId = typeof song.youtubeId === "string" && videoIdPattern.test(song.youtubeId)
            ? song.youtubeId
            : "";
          const isEmbeddable = !!videoId && song.youtubeEmbeddable === true;
          const playlistUrl = `https://www.youtube.com/playlist?list=${playlistId}`;
          const watchUrl = `https://www.youtube.com/watch?v=${videoId}`;
          const videoContent = isEmbeddable
            ? `<div class="videowrap">
                <iframe
                  src="https://www.youtube-nocookie.com/embed/${videoId}?rel=0&playsinline=1"
                  title="${esc(song.t)} YouTube video"
                  loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen></iframe>
              </div>`
            : videoId
              ? `<p class="video-pending">இந்த காணொளியை இங்கே இயக்க அனுமதி இல்லை.<br><a href="${watchUrl}" target="_blank" rel="noopener">YouTube இல் இந்த காணொளியைத் திற · Open this video on YouTube</a></p>`
              : `<p class="video-pending">இந்த பாடலுக்கான காணொளி playlist இல் இன்னும் இல்லை.<br><a href="${playlistUrl}" target="_blank" rel="noopener">முழு playlist ஐ திற · Open the full playlist</a></p>`;

          detail.innerHTML = `
            <a class="back" href="index.html">‹ பட்டியல் · Back to list</a>

            <section class="songcard">
              <div class="bignum">${song.num}</div>
              <div class="bigtitle">${esc(song.t)}</div>
              <div class="oldno">பாடல் எண் ${song.num}</div>
              <div class="card-actions">
                <button class="fav-toggle" id="fav-toggle" type="button" aria-pressed="false">
                  <span class="fav-ico">☆</span>
                  <span class="fav-label">பிடித்தது · Favourite</span>
                </button>
                <button class="share-btn" id="share-btn" type="button">
                  <span class="share-ico">↗</span>
                  <span class="share-label">பகிர் · Share</span>
                </button>
              </div>
            </section>

            <section class="audio-main" id="audio-main" hidden>
              <h2 class="section-title">🎵 பாடல் · Audio</h2>
              <div id="audio-main-player"></div>
            </section>

            <section class="lyrics" id="lyrics">
              <h2 class="lyrics-title">பாடல் வரிகள் · Lyrics</h2>
              <div class="lyrics-imagewrap">
                <img class="lyrics-image" id="lyrics-image"
                     src="lyrics/${song.num}.png"
                     alt="${esc(song.t)} பாடல் வரிகள்"
                     onerror="var s=document.getElementById('lyrics'); if(s) s.hidden=true;" />
              </div>
            </section>

            ${videoContent}

            <section class="extras" id="extras" hidden>
              <h2 class="section-title">மற்ற பதிவுகள் · Other recordings</h2>
              <div id="extras-list"></div>
            </section>
          `;

          if (store) {
            store.addRecent(song.num);
            const favToggle = document.getElementById("fav-toggle");
            if (favToggle) {
              const paint = (on) => {
                favToggle.classList.toggle("on", on);
                favToggle.setAttribute("aria-pressed", on ? "true" : "false");
                favToggle.querySelector(".fav-ico").textContent = on ? "★" : "☆";
                favToggle.querySelector(".fav-label").textContent =
                  on ? "பிடித்தது · Favourited" : "பிடித்தது · Favourite";
              };
              paint(store.isFavourite(song.num));
              favToggle.addEventListener("click", () => paint(store.toggleFavourite(song.num)));
            }
          }

          const shareBtn = document.getElementById("share-btn");
          if (shareBtn) {
            const shareUrl = location.href;
            const shareTitle = `${song.num}. ${song.t}`;
            const shareText = `திருப்புகழ் பாடல் ${song.num}: ${song.t}\n${shareUrl}`;
            shareBtn.addEventListener("click", async () => {
              // Prefer the native share sheet (WhatsApp appears there on phones).
              if (navigator.share) {
                try {
                  await navigator.share({ title: shareTitle, text: `திருப்புகழ் பாடல் ${song.num}: ${song.t}`, url: shareUrl });
                  return;
                } catch (err) {
                  if (err && err.name === "AbortError") return; // user dismissed
                }
              }
              // Fallback: open WhatsApp directly with a prefilled message.
              window.open(`https://wa.me/?text=${encodeURIComponent(shareText)}`, "_blank", "noopener");
            });
          }

          // Audio: main singer player + any number of extra recordings
          // (other singers' audio and/or other authors' videos), from audio.json.
          if (window.TPAudio) {
            window.TPAudio.load().then((manifest) => {
              const info = window.TPAudio.forSong(manifest, song.num);

              if (info.main) {
                const mainWrap = document.getElementById("audio-main");
                const audio = document.createElement("audio");
                audio.controls = true;
                audio.preload = "none";
                audio.setAttribute("controlsList", "nodownload noplaybackrate");
                audio.src = info.main.src;
                audio.className = "audio-el";
                document.getElementById("audio-main-player").appendChild(audio);
                mainWrap.hidden = false;
              }

              if (info.extra.length) {
                const list = document.getElementById("extras-list");
                info.extra.forEach((item) => {
                  const card = document.createElement("div");
                  card.className = "extra-item";
                  const label = document.createElement("div");
                  label.className = "extra-label";
                  label.textContent = item.label || (item.type === "video" ? "Video" : "Audio");
                  card.appendChild(label);
                  if (item.type === "audio") {
                    const a = document.createElement("audio");
                    a.controls = true;
                    a.preload = "none";
                    a.setAttribute("controlsList", "nodownload noplaybackrate");
                    a.src = item.src;
                    a.className = "audio-el";
                    card.appendChild(a);
                  } else {
                    const wrap = document.createElement("div");
                    wrap.className = "videowrap";
                    const f = document.createElement("iframe");
                    f.src = `https://www.youtube-nocookie.com/embed/${item.youtubeId}?rel=0&playsinline=1`;
                    f.title = (item.label || "") + " YouTube video";
                    f.loading = "lazy";
                    f.referrerPolicy = "strict-origin-when-cross-origin";
                    f.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
                    f.allowFullscreen = true;
                    wrap.appendChild(f);
                    card.appendChild(wrap);
                  }
                  list.appendChild(card);
                });
                document.getElementById("extras").hidden = false;
              }
            });
          }
        })
        .catch(() => {
          detail.innerHTML = '<a class="back" href="index.html">‹ Back</a><p class="empty">Could not load songs.json.</p>';
        });
    })();
  </script>
</body>
</html>
