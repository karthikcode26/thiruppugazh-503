<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c0392b" />
  <title>திருப்புகழ் 503 பாடல்கள் | Thiruppugazh 503 Songs</title>
  <meta name="description" content="List of 503 Thiruppugazh songs with links to lyrics, YouTube and audio." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>திருப்புகழ்</h1>
      <p class="sub">அருணகிரிநாதர் — 503 பாடல்கள் · Thiruppugazh 503 Songs</p>
    </header>

    <div class="stickytop">
      <div class="searchbar">
        <div class="search-input-row">
          <input
            id="search"
            type="search"
            inputmode="search"
            autocomplete="off"
            placeholder="பாடல் எண் அல்லது சொல் தேடு  ·  Search number or word"
            aria-label="Search songs by number or first word"
          />
          <button class="mic-btn" id="mic-btn" type="button" hidden aria-label="Voice search">🎤</button>
        </div>
        <div class="count" id="count"></div>
      </div>

      <nav class="rangebar" id="rangebar" aria-label="Jump to song range"></nav>
    </div>

    <section class="shelf" id="recent-shelf" hidden>
      <h2 class="shelf-title">சமீபத்தில் பார்த்தவை · Recently viewed</h2>
      <div class="chips" id="recent-chips"></div>
    </section>

    <section class="shelf" id="fav-shelf" hidden>
      <div class="shelf-head">
        <h2 class="shelf-title">பிடித்தவை · Favourites</h2>
        <button class="playfav-btn" id="playfav-btn" type="button" hidden>▶ Play favourites</button>
      </div>
      <div class="chips" id="fav-chips"></div>
    </section>

    <div class="nowplaying" id="nowplaying" hidden>
      <div class="np-row">
        <button class="np-btn np-prev" type="button" aria-label="Previous">⏮</button>
        <button class="np-btn np-play" type="button" aria-label="Play or pause">⏸</button>
        <button class="np-btn np-next" type="button" aria-label="Next">⏭</button>
        <div class="np-info">
          <span class="np-title"></span>
          <span class="np-pos"></span>
        </div>
        <button class="np-btn np-stop" type="button" aria-label="Stop">✕</button>
      </div>
      <div class="np-seekrow">
        <span class="np-cur">0:00</span>
        <input class="np-seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" />
        <span class="np-dur">0:00</span>
      </div>
    </div>

    <ul class="list" id="list">
      <li class="loading">ஏற்றுகிறது… Loading songs…</li>
    </ul>

    <footer class="footer">
      அருணகிரிநாதர் திருப்புகழ் · 503 பாடல்கள்
    </footer>
  </div>

  <button class="to-top" id="to-top" type="button" hidden aria-label="Back to top">↑</button>

  <script src="store.js?v=20"></script>
  <script src="audio.js?v=20"></script>
  <script src="app.js?v=20"></script>
</body>
</html>
